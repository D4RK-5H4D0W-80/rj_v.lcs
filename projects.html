<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects | rj_v.lcs</title>
   <link rel="icon" href="images/logo.png" type="image/x-icon">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Set main layout to allow natural vertical content flow across sections */
    main {
      padding: 90px 10% 40px 10%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 4rem;
      overflow-x: hidden;
    }

    /* ==========================================
       SECTION 1: HERO DISPLAY (Text & Carousel)
       ========================================== */
    .hero-split-section {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: 4rem;
      min-height: calc(100vh - 150px);
      width: 100%;
    }

    /* Left Column: Context Card Details */
    .hero-text-side {
      flex: 1;
      max-width: 550px;
    }

    .hero-text-side h1 { color: #ffa500; }
    .hero-text-side p { color: #ffffff; }

    [data-theme="light"] .hero-text-side h1 { color: #ffa500 !important; }
    [data-theme="light"] .hero-text-side p { color: #64748b !important; }

    .hero-text-side h1 {
      font-size: 3rem;
      line-height: 1.2;
      margin-bottom: 1.5rem;
      color: var(--accent, #ffa500);
    }

    .hero-text-side p {
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .action-btn {
      display: inline-block;
      padding: 0.8rem 2rem;
      background-color: var(--accent, #ffa500);
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 600;
      transition: transform 0.2s ease, opacity 0.2s ease;
      border: none;
      cursor: pointer;
    }

    .action-btn:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    /* Right Column: Graphic Design Carousel Engine */
    .hero-carousel-side {
      flex: 1.2;
      max-width: 520px;
      width: 100%;
    }

    .carousel-viewport {
      position: relative;
      width: 100%;
      height: auto;
      aspect-ratio: 6 / 7; /* Forces a standard uniform sizing container */
      border-radius: 12px;
      overflow: hidden; 
      background-color: #0b0f19; /* Sleek dark canvas background */
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    }

    .carousel-track {
      display: flex;
      width: 100%;
      height: 100%;
      position: relative;
    }

    .carousel-slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.6s ease;
      /* background-color: #ffffff; */
    }

    /* [data-theme="light"] .carousel-slide { background-color: #1e293b !important; } */

    /* Active slide overlays dynamically with a beautiful blend fade */
    .carousel-slide.active-slide {
      opacity: 1;
      visibility: visible;
      z-index: 2;
    }

    .carousel-slide img {
      width: 100%;
      height: 100%;
      /* object-fit: contain; Guarantees the full image is seen without any cuts */
      display: block;
      border: #ffa500 solid 5px;
      border-radius: 20px;
    }

    /* Navigation Controls overlay */
    .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(15, 23, 42, 0.7);
      color: #fff;
      border: none;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease, transform 0.2s ease;
      z-index: 10;
    }

    .carousel-btn:hover {
      background: rgba(15, 23, 42, 0.9);
    }
    
    .carousel-btn:active {
      transform: translateY(-50%) scale(0.95);
    }

    .carousel-btn.prev { left: 15px; }
    .carousel-btn.next { right: 15px; }

    /* Indicator Bullets Container with overflow protection */
    .carousel-indicators-container {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 85%;
      overflow-x: auto;
      padding: 5px 0;
      z-index: 10;
    }
    
    .carousel-indicators-container::-webkit-scrollbar { display: none; }

    .carousel-indicators {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      width: max-content;
      margin: 0 auto;
    }

    .indicator-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      cursor: pointer;
      transition: background 0.2s ease, width 0.3s ease, border-radius 0.2s ease;
    }

    .indicator-dot.active {
      background: var(--accent, #ffa500);
      width: 20px;
      border-radius: 10px;
    }

    /* Admin link button configuration placement */
    .admin-entry-btn {
      display: inline-block;
      margin-top: 1rem;
      font-size: 0.9rem;
      color: var(--accent, #ffa500);
      text-decoration: underline;
    }

    /* ==========================================
       SECTION 2: SECONDARY DISPLAY GRID WITH IMAGES
       ========================================== */
    .showcase-section {
      width: 100%;
      padding-top: 2rem;
      border-top: 1px solid rgba(100, 116, 139, 0.2);
    }

    .showcase-section h2 {
      font-size: 2rem;
      margin-bottom: 2rem;
      color: var(--text-main, #ffffff);
    }

    [data-theme="light"] .showcase-section h2 {
      color: #1e293b;
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2rem;
      width: 100%;
    }

    .project-card {
      background: var(--card-bg, rgba(255,255,255,0.05));
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 0; /* Cleared internal padding to let image rest perfectly on header tracks */
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    [data-theme="light"] .project-card {
      background: #ffffff;
      border: 1px solid rgba(100, 116, 139, 0.15);
    }

    .project-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.2);
    }

    /* Card Image Engine */
    .project-card-image-wrapper {
      width: 100%;
      height: 180px;
      background-color: #0b0f19;
      overflow: hidden;
    }

    .project-card-image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .project-card:hover .project-card-image-wrapper img {
      transform: scale(1.05);
    }

    /* Card Text Structure wrapper */
    .project-card-content {
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .project-card h3 {
      font-size: 1.3rem;
      color: #ffa500;
      margin: 0 0 0.75rem 0;
    }

    .project-card p {
      font-size: 0.95rem;
      line-height: 1.5;
      color: #cbd5e1;
      margin: 0 0 1.5rem 0;
      flex-grow: 1; /* Pushes button to align symmetrically across cards */
    }

    [data-theme="light"] .project-card p {
      color: #475569;
    }

    /* Small specialized card control asset */
    .card-view-btn {
      display: inline-block;
      text-align: center;
      padding: 0.65rem 1.2rem;
      background-color: transparent;
      color: #ffa500;
      border: 2px solid #ffa500;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.9rem;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .card-view-btn:hover {
      background-color: #ffa500;
      color: #ffffff;
    }

    /* ==========================================
       RESPONSIVE MEDIA QUERIES
       ========================================== */
    @media (max-width: 1024px) {
      .projects-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 768px) {
      nav ul {
        flex-direction: column !important;
        align-items: flex-start !important;
        width: 100%;
        height: auto;
      }
      
      nav ul li {
        width: 100%;
      }

      main {
        padding: 120px 6% 40px 6%;
      }

      .hero-split-section {
        flex-direction: column;
        gap: 3rem;
        text-align: center;
        min-height: auto;
      }

      .hero-text-side {
        max-width: 100%;
      }

      .hero-text-side h1 {
        font-size: 2.2rem;
      }

      .hero-carousel-side {
        max-width: 440px;
      }

      .projects-grid {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }
    }

    /* ==========================================
       BRAND LOGO & USER ICON LAYOUT BLOCK
       ========================================== */
    .brand-container {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-user-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text-main, #ffffff);
      transition: color 0.2s ease, transform 0.2s ease;
      cursor: pointer;
      text-decoration: none;
    }

    .brand-user-icon:hover {
      color: #ffa500;
      transform: scale(1.05);
    }

    .brand-user-icon svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }
  </style>
</head>
<body>

  <nav>
    <div class="brand-container">
      <h3>rj_v.lcs</h3>
      <a href="login.html" class="brand-user-icon" title="Admin Access Panel">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M12,4A4,4 0 0,1 16,8A4,4 0 0,1 12,12A4,4 0 0,1 8,8A4,4 0 0,1 12,4M12,14C16.42,14 20,15.79 20,18V20H4V18C4,15.79 7.58,14 12,14Z" />
        </svg>
      </a>
    </div>

    <div class="nav-right">
      <input type="checkbox" id="menu-toggle" class="menu-toggle-input">
      <label for="menu-toggle" class="burger-menu-btn">
        <span></span>
        <span></span>
        <span></span>
      </label>
     <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="skills.html">Skills</a></li>
        <li><a href="projects.html" class="active">Projects</a></li>
        <li><a href="apps.html">Applications</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
      <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
    </div>
  </nav>

  <main>
    <section class="hero-split-section">
      
      <div class="hero-text-side">
        <h1>Graphic Design Projects</h1>
        <p>If you are interested in the sample design I made, just contact me:</p>
        <a href="contact.html" class="action-btn">Click Here!</a>
        <br>
        <!-- <a href="admin.html" class="admin-entry-btn">⚙️ Open Content Manager</a> -->
      </div>

      <div class="hero-carousel-side">
        <div class="carousel-viewport">
          <button class="carousel-btn prev" onclick="moveSlide(-1)">❮</button>
          <button class="carousel-btn next" onclick="moveSlide(1)">❯</button>
          
          <div class="carousel-track" id="carouselTrack"></div>

          <div class="carousel-indicators-container">
            <div class="carousel-indicators" id="carouselIndicators"></div>
          </div>
        </div>
      </div>

    </section>

    <section class="showcase-section" id="more-projects">
      <h2 style="color: #ffa500;">Website Projects</h2>
      <div class="projects-grid" id="highlightsGridTarget"></div>
    </section>
  </main>

  <script>
    /* Theme State Engine */
    function toggleTheme() {
      const current = document.body.getAttribute('data-theme');
      const targetTheme = current === 'light' ? 'dark' : 'light';
      document.body.setAttribute('data-theme', targetTheme);
      localStorage.setItem('theme', targetTheme);
    }
    document.body.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');

    /* Baseline Initial Fallback Carousel Data */
    const defaultSlides = [
      { id: "slide_1", src: "images/a.png", alt: "Delicious Burger Advertisement Poster" },
      { id: "slide_2", src: "images/b.png", alt: "Delicious Hotdog with Fries Promo Poster" },
      { id: "slide_3", src: "images/c.png", alt: "Magic Bean Café Poster Concept" },
      { id: "slide_4", src: "images/d.png", alt: "Spaghetti Pasta Promotion Art" },
      { id: "slide_5", src: "images/e.png", alt: "Chips, Beer and Beverages Ad Poster" },
      { id: "slide_6", src: "images/f.png", alt: "Skincare Gold Beautiful Skin Cosmetics Banner" },
      { id: "slide_7", src: "images/g.png", alt: "Under Armour SC30 Sneakers New Collection Poster" },
      { id: "slide_8", src: "images/h.png", alt: "Strawberry Matcha Latte and Cake Poster" },
      { id: "slide_9", src: "images/i.png", alt: "Fresh Strawberry Juice Bottle Creative Showcase" },
      { id: "slide_10", src: "images/j.png", alt: "Sweet and Sour Chicken Food Advertising Layout" },
      { id: "slide_11", src: "images/k.png", alt: "Sweet and Sour Chicken Food Advertising Layout" }
    ];

    /* Baseline Initial Fallback Highlight Card Data */
    const defaultCards = [
      { id: "card_1", title: "Application Engine", desc: "Interactive software application platform built with core UI scalability standards.", image: "images/app-engine.jpg", link: "apps.html" },
      { id: "card_2", title: "E-Commerce Platform", desc: "Responsive online interface complete with dynamic transaction components.", image: "images/ecommerce.jpg", link: "apps.html" },
      { id: "card_3", title: "System Dashboard", desc: "Complex visual workspace analytics console optimizing high-volume logical flows.", image: "images/dashboard.jpg", link: "apps.html" }
    ];

    // Read stored databases or set structural baselines
    let portfolioItems = JSON.parse(localStorage.getItem('portfolio_slides')) || [];
    if (portfolioItems.length === 0) {
      portfolioItems = defaultSlides;
      localStorage.setItem('portfolio_slides', JSON.stringify(defaultSlides));
    }

    let highlightItems = JSON.parse(localStorage.getItem('development_highlights')) || [];
    if (highlightItems.length === 0) {
      highlightItems = defaultCards;
      localStorage.setItem('development_highlights', JSON.stringify(defaultCards));
    }

    /* Build Carousel DOM Nodes */
    const track = document.getElementById('carouselTrack');
    const indicatorsContainer = document.getElementById('carouselIndicators');

    track.innerHTML = '';
    indicatorsContainer.innerHTML = '';

    portfolioItems.forEach((item, index) => {
      const slide = document.createElement('div');
      slide.className = `carousel-slide ${index === 0 ? 'active-slide' : ''}`;
      slide.innerHTML = `<img src="${item.src}" alt="${item.alt || 'Portfolio Art'}" onerror="this.src='images/web design.png'">`;
      track.appendChild(slide);

      const dot = document.createElement('div');
      dot.className = `indicator-dot ${index === 0 ? 'active' : ''}`;
      dot.addEventListener('click', () => jumpToSlide(index));
      indicatorsContainer.appendChild(dot);
    });

    /* Build Highlights Grid Nodes Dynamically - target="_blank" added below */
    const gridTarget = document.getElementById('highlightsGridTarget');
    gridTarget.innerHTML = highlightItems.map(card => `
      <div class="project-card">
        <div class="project-card-image-wrapper">
          <img src="${card.image}" alt="${card.title}" onerror="this.src='images/web design.png'">
        </div>
        <div class="project-card-content">
          <h3>${card.title}</h3>
          <p>${card.desc}</p>
          <a href="${card.link || 'apps.html'}" target="_blank" class="card-view-btn">View Project</a>
        </div>
      </div>
    `).join('');

    /* Carousel Operations Engine */
    let activeIndex = 0;
    const slides = document.querySelectorAll('.carousel-slide');
    const dots = document.querySelectorAll('.indicator-dot');
    const totalSlides = dots.length;

    function updateCarouselDisplay() {
      if (totalSlides === 0) return;
      slides.forEach((slide, index) => {
        slide.classList.toggle('active-slide', index === activeIndex);
      });

      dots.forEach((dot, index) => {
        if(index === activeIndex) {
          dot.classList.add('active');
          dot.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        } else {
          dot.classList.remove('active');
        }
      });
    }

    function moveSlide(direction) {
      if (totalSlides === 0) return;
      activeIndex += direction;
      if (activeIndex >= totalSlides) activeIndex = 0;
      if (activeIndex < 0) activeIndex = totalSlides - 1;
      updateCarouselDisplay();
    }

    function jumpToSlide(index) {
      activeIndex = index;
      updateCarouselDisplay();
    }

    let autoSlideInterval = setInterval(() => { moveSlide(1); }, 4500);

    function resetSlideTimer() {
      clearInterval(autoSlideInterval);
      autoSlideInterval = setInterval(() => { moveSlide(1); }, 4500);
    }
    
    document.querySelectorAll('.carousel-btn').forEach(el => {
      el.addEventListener('click', resetSlideTimer);
    });
  </script>
</body>
</html>
