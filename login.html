<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | rj_v.lcs</title>
  <link rel="icon" href="images/logo.png" type="image/x-icon">
  <link rel="stylesheet" href="style.css">
  <style>
    main {
      padding: 85px 10% 40px 10%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .login-container {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 2.5rem;
      border-radius: 12px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    [data-theme="light"] .login-container {
      background: #ffffff;
      border: 1px solid rgba(100, 116, 139, 0.2);
      box-shadow: 0 20px 40px rgba(100, 116, 139, 0.1);
    }

    .login-container h1 {
      margin-top: 0;
      font-size: 1.75rem;
      color: var(--accent, #ffa500);
      margin-bottom: 0.5rem;
      text-align: center;
    }

    .login-container p { color: #ffffff; text-align: center; font-size: 0.95rem; margin-bottom: 2rem; }
    [data-theme="light"] .login-container p { color: #64748b !important; }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.4rem;
      font-weight: 500;
      font-size: 0.9rem;
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 6px;
      border: 1px solid rgba(100, 116, 139, 0.4);
      background: rgba(0, 0, 0, 0.2);
      box-sizing: border-box;
      font-size: 1rem;
    }

    [data-theme="light"] .form-group input {
      background: rgba(0, 0, 0, 0.02);
      color: #000000;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--accent, #ffa500);
    }

    .error-banner {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid #ef4444;
      color: #ef4444;
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 0.9rem;
      margin-bottom: 1.25rem;
      font-weight: 500;
      display: none;
      text-align: center;
    }

    .login-btn {
      width: 100%;
      padding: 0.8rem;
      background: var(--accent, #ffa500);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .login-btn:hover {
      background: #e09200;
    }

    .action-links-container {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-top: 1.25rem;
      text-align: center;
    }

    .secondary-link {
      display: inline-block;
      font-size: 0.9rem;
      color: var(--text-muted, #94a3b8);
      text-decoration: none;
      transition: color 0.2s;
    }

    .secondary-link:hover {
      color: var(--accent, #ffa500);
      text-decoration: underline;
    }

    .username_Field { color: #ffffff; }
    [data-theme="light"] .username_Field { color: #64748b !important; }

    .usernameField { color: #ffffff; }
    [data-theme="light"] .usernameField { color: #64748b !important; }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-user-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text-main, #ffffff);
      transition: color 0.2s ease, transform 0.2s ease;
      cursor: pointer;
      text-decoration: none;
    }

    .brand-user-icon:hover {
      color: #ffa500;
      transform: scale(1.05);
    }

    .brand-user-icon svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }
  </style>
</head>
<body>

  <nav>
    <div class="brand-container">
      <h3>rj_v.lcs</h3>
      <a href="login.html" class="brand-user-icon" title="Admin Access Panel">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M12,4A4,4 0 0,1 16,8A4,4 0 0,1 12,12A4,4 0 0,1 8,8A4,4 0 0,1 12,4M12,14C16.42,14 20,15.79 20,18V20H4V18C4,15.79 7.58,14 12,14Z" />
        </svg>
      </a>
    </div>

    <div class="nav-right">
      <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
    </div>
  </nav>

  <main>
    <div class="login-container">
      <h1>Authorized access only: Ricky Jay V. Licos.</h1>
      <p>Enter your authorization credentials to edit system configurations.</p>
      
      <div class="error-banner" id="errorBanner">Username or password is incorrect.</div>

      <!-- Critical Fix: Added async tracking step directly on the form submission event -->
      <form id="loginForm" onsubmit="event.preventDefault(); executeCredentialCheck();">
        <div class="form-group">
          <label class="username_Field" for="usernameField">Username</label>
          <input class="usernameField" type="text" id="usernameField" placeholder="Enter Username" required>
        </div>
        
        <div class="form-group">
          <label class="username_Field" for="passwordField">Password</label>
          <input class="usernameField" type="password" id="passwordField" placeholder="Enter Password" required>
        </div>

        <button type="submit" class="login-btn">Login</button>
        
        <div class="action-links-container">
          <!-- <a class="secondary-link" href="create-account.html">Don't have an account? Create Account</a> -->
          <a class="secondary-link" href="index.html">Return to Public Homepage</a>
        </div>
      </form>
    </div>
  </main>

  <script>
    document.body.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');

    function toggleTheme() {
      const current = document.body.getAttribute('data-theme');
      const targetTheme = current === 'light' ? 'dark' : 'light';
      document.body.setAttribute('data-theme', targetTheme);
      localStorage.setItem('theme', targetTheme);
    }

    // Modern browser utility wrapper calculating SHA-256 string hashes
    async function sha256(message) {
      const msgBuffer = new TextEncoder().encode(message);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function executeCredentialCheck() {
      const usernameInput = document.getElementById('usernameField').value.trim();
      const passwordInput = document.getElementById('passwordField').value;
      const errorBanner = document.getElementById('errorBanner');

      // Hash user input right away 
      const inputPasswordHash = await sha256(passwordInput);

      // Default Admin Credentials
      const defaultUser = 'rjvlicos';
      const defaultHash = 'c98cc9f939e6022e374df6cda1365b21d513813ff30b200b216972740a6b5791'; // Thisismywebsite16!

      // Fetch custom registration profile data from LocalStorage if it exists
      const customAccountData = localStorage.getItem('customAdminAccount');
      let customAccount = null;
      if (customAccountData) {
        customAccount = JSON.parse(customAccountData);
      }

      // Check input against default OR custom profiles
      const isDefaultValid = (usernameInput === defaultUser && inputPasswordHash === defaultHash);
      const isCustomValid = customAccount && (usernameInput === customAccount.username && inputPasswordHash === customAccount.passwordHash);

      if (isDefaultValid || isCustomValid) {
        errorBanner.style.display = 'none';
        window.location.href = 'index-manager.html';
      } else {
        errorBanner.style.display = 'block';
      }
    }
  </script>
</body>
</html>
